name: Send queued posts to Telegram

on:
  push:
    branches: [main]
    paths: ["queue/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-queue
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/tg_send.py
      - name: Save results
        run: |
          git config user.name "anvarov-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/*.result.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Telegram results"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
